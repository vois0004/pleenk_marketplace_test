# =============================================================================
# Configuration pour les tests
# =============================================================================

spring.application.name=marketplace-test

# H2 Database for tests
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Disable H2 console for tests
spring.h2.console.enabled=false

# Pleenk Test Configuration (sandbox values for integration tests)
pleenk.private-key=-----BEGIN PRIVATE KEY-----\n\
-----END PRIVATE KEY-----
pleenk.wallet.id=wallet-123
pleenk.widget.base-url=https://app.sandbox.pleenk.com
