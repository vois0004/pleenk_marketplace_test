spring.application.name=marketplace
# Active le profil local par défaut (pour le développement)
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}
spring.datasource.url=jdbc:h2:mem:marketplace
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=super_admin
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
pleenk.widget.base-url=${PLEENK_WIDGET_BASE_URL:https://app.sandbox.pleenk.com}
pleenk.wallet.id=${PLEENK_WALLET_ID:}
pleenk.private-key=${PLEENK_PRIVATE_KEY:}
pleenk.public-key=${PLEENK_PUBLIC_KEY:}


