<div class="max-w-3xl mx-auto px-4 py-8">
  <button (click)="goBack()"
          class="text-blue-600 hover:underline mb-6 flex items-center gap-2">
    ← Retour aux produits
  </button>

  <div *ngIf="loading" class="text-center py-20 text-lg text-gray-600">
    Chargement...
  </div>

  <div *ngIf="error" class="bg-red-50 text-red-700 p-4 rounded-lg text-center mb-6">
    {{ error }}
  </div>

  <!-- Formulaire paiement -->
  <div *ngIf="product && !loading"
       class="bg-white rounded-xl shadow-lg p-6">

    <h2 class="text-2xl font-bold text-gray-800 mb-6">
      Récapitulatif de commande
    </h2>

    <div class="flex gap-4 p-4 bg-gray-50 rounded-lg mb-6">
      <div class="w-24 h-24 bg-white rounded-lg flex items-center justify-center overflow-hidden flex-shrink-0">
        <img *ngIf="product.imageUrl"
             [src]="product.imageUrl"
             [alt]="product.name"
             class="max-w-full max-h-full object-cover">
        <span *ngIf="!product.imageUrl" class="text-gray-400 text-xs">Image</span>
      </div>

      <div>
        <h3 class="font-semibold text-lg text-gray-800 mb-2">
          {{ product.name }}
        </h3>
        <p class="text-xl font-bold text-green-700">
          {{ product.price | currency:'EUR':'symbol':'1.2-2' }}
        </p>
      </div>
    </div>

    <div class="flex items-center gap-4 mb-6">
      <label class="font-medium text-gray-700">Quantité :</label>
      <div class="flex items-center gap-3">
        <button (click)="decrementQuantity()"
                [disabled]="quantity <= 1"
                class="w-9 h-9 border rounded-lg hover:bg-gray-50 disabled:opacity-50 disabled:cursor-not-allowed">
          -
        </button>
        <span class="text-lg font-medium min-w-[30px] text-center">{{ quantity }}</span>
        <button (click)="incrementQuantity()"
                [disabled]="quantity >= product.quantity"
                class="w-9 h-9 border rounded-lg hover:bg-gray-50 disabled:opacity-50 disabled:cursor-not-allowed">
          +
        </button>
      </div>
      <span class="text-sm text-gray-600">({{ product.quantity }} disponible(s))</span>
    </div>

    <div class="flex justify-between items-center py-4 border-t-2 mb-6">
      <span class="text-lg text-gray-700">Total :</span>
      <span class="text-3xl font-bold text-blue-600">
        {{ totalAmount | currency:'EUR':'symbol':'1.2-2' }}
      </span>
    </div>

    <button (click)="createPayment()"
            [disabled]="creatingPayment"
            class="w-full py-4 bg-blue-600 hover:bg-blue-700 text-white rounded-lg text-lg font-bold
                   disabled:bg-gray-300 disabled:cursor-not-allowed transition-colors">
      {{ creatingPayment ? 'Création du paiement...' : 'Procéder au paiement' }}
    </button>
  </div>
</div>
