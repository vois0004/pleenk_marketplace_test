<div class="bg-gray-100 min-h-screen">
    <div class="mx-auto max-w-7xl px-4 py-16 sm:px-6 sm:py-24 lg:px-8">
      <h2 class="text-3xl font-bold tracking-tight text-gray-900 mb-12">Marketplace Pleenk</h2>
  
      <div *ngIf="loading" class="text-center py-20">
        <div class="inline-block h-8 w-8 animate-spin rounded-full border-4 border-solid border-indigo-600 border-r-transparent"></div>
        <p class="mt-4 text-gray-600">Chargement...</p>
      </div>
  
      <div *ngIf="error" class="text-center py-20">
        <p class="text-lg text-red-600">{{ error }}</p>
      </div>
  
      <div *ngIf="!loading && !error && products.length === 0" class="text-center py-20">
        <p class="text-lg text-gray-500">Aucun produit disponible</p>
      </div>
  
      <div class="grid grid-cols-1 gap-6 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 mx-auto" style="max-width: fit-content;">
        <div *ngFor="let product of products" 
             class="bg-white rounded-xl shadow-sm hover:shadow-md transition-shadow duration-300 overflow-hidden flex flex-col">
          
          <!-- Image Container with fixed height -->
          <div class="relative w-full aspect-square bg-gray-100 overflow-hidden">
            <img *ngIf="product.imageUrl"
                 [src]="product.imageUrl"
                 [alt]="product.name"
                 class="w-full h-full object-cover transition-transform duration-300 group-hover:scale-105">
            
            <div *ngIf="!product.imageUrl"
                 class="w-full h-full flex items-center justify-center">
              <svg class="h-16 w-16 text-gray-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path>
              </svg>
            </div>
  
            <!-- Badge Rupture de stock -->
            <div *ngIf="!isAvailable(product)"
                 class="absolute inset-0 bg-black bg-opacity-50 flex items-center justify-center">
              <span class="bg-red-500 text-white px-4 py-2 rounded-full text-sm font-semibold shadow-lg">
                Rupture de stock
              </span>
            </div>
          </div>
  
          <!-- Product Content - with flex-1 to push button to bottom -->
          <div class="p-5 flex flex-col flex-1">
            <!-- Title - fixed height -->
            <h3 class="text-base font-semibold text-gray-900 mb-2 line-clamp-2 min-h-[3rem]">
              {{ product.name }}
            </h3>
            
            <!-- Description - fixed height -->
            <p class="text-sm text-gray-600 mb-4 line-clamp-2 min-h-[2.5rem]">
              {{ product.description }}
            </p>
            
            <!-- Price - fixed height -->
            <div class="mb-3 min-h-[2rem] flex items-center">
              <p class="text-2xl font-bold text-gray-900">
                {{ product.price | currency:'EUR':'symbol':'1.2-2' }}
              </p>
            </div>
  
            <!-- Stock Info - fixed height -->
            <div class="mb-4 min-h-[1.5rem]">
              <p *ngIf="isAvailable(product)" class="text-sm font-medium text-emerald-600">
                En stock ({{ product.quantity }})
              </p>
              <p *ngIf="!isAvailable(product)" class="text-sm font-medium text-red-500">
                Indisponible
              </p>
            </div>
  
            <!-- Button - pushed to bottom with mt-auto -->
            <button *ngIf="isAvailable(product)"
                    (click)="goToPayment(product)"
                    class="mt-auto w-full bg-orange-600 hover:bg-orange-700 active:bg-orange-800 text-white font-semibold py-3 px-4 rounded-lg transition-colors duration-200 shadow-sm hover:shadow">
              Acheter
            </button>
            
            <button *ngIf="!isAvailable(product)"
                    disabled
                    class="mt-auto w-full bg-gray-200 text-gray-400 font-semibold py-3 px-4 rounded-lg cursor-not-allowed">
              Indisponible
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
